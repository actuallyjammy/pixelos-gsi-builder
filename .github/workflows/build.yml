name: Build PixelOS GSI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixelos-gsi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h .
          python3 -c 'import shutil; assert shutil.disk_usage(".").free > 25 * 1024**3, "Need at least 25 GiB free"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl aria2 openssl patch ca-certificates libarchive-tools default-jre-headless xz-utils
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - name: Fetch pinned tools
        run: python3 scripts/fetch-tools.py
      - name: Build PHH Treble Settings
        working-directory: toolchains/treble_app
        run: |
          # JCenter is retired; these dependencies are available on Maven Central.
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle
          bash build.sh release
      - name: Download and verify the donor ROM
        run: python3 scripts/download-donor.py
      - name: Port PixelOS and package the GSI
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/build.py 2>&1 | tee artifacts/build.log
      - name: Upload image and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixelos-17-gsi-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
